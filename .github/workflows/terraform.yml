name: "Terraform AWS Platform Pipeline"

on:
  push:
    branches:
      - dev-branch
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  # ==========================================
  # STAGE 1: INFRASTRUCTURE MANAGEMENT
  # ==========================================
  infrastructure:
    name: "Infrastructure (Terraform)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Terraform CLI
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Check Code Formatting
        run: terraform fmt -check

      - name: Initialize Terraform Working Directory
        run: terraform init

      - name: Validate Infrastructure Code Syntax
        run: terraform validate

      - name: Calculate Plan (Dev Environment)
        run: terraform plan -var-file="variables/dev.tfvars" -out=tfplan.binary

      - name: Deploy Live Infrastructure Change
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve tfplan.binary

 # ==========================================
  # STAGE 2: APPLICATION BUILD & DEPLOYMENT
  # ==========================================
  build_and_deploy:
    name: "Application Build & Deploy"
    needs: infrastructure # <-- This makes Stage 2 wait for Stage 1 to finish successfully!
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' # Only runs on main branch deployments
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Application Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: dev-my-kubernetes-app
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -f app/src/Dockerfile .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      # 1. Connect to your EKS Cluster
      - name: Authenticate Kubeconfig
        run: aws eks update-kubeconfig --region eu-north-1 --name dev-eks-cluster

      # 2. Install/Update the AWS Load Balancer Controller engine via Helm
      - name: Install or Update AWS Load Balancer Controller
        run: |
          helm repo add eks https://aws.github.io/eks-charts
          helm repo update

           # Dynamically fetch the AWS Account ID and VPC ID to set the correct IAM Role ARN for the Load Balancer Controller

          AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          VPC_ID=$(aws eks describe-cluster --name dev-eks-cluster --region eu-north-1 --query "cluster.resourcesVpcConfig.vpcId" --output text)
          
          helm upgrade --install aws-load-balancer-controller eks/aws-load-balancer-controller \
          -n kube-system \
          --set clusterName=dev-eks-cluster \
          --set serviceAccount.create=true \
          --set serviceAccount.name=aws-load-balancer-controller \
          --set serviceAccount.annotations."eks\.amazonaws\.com/role-arn"=arn:aws:iam::${AWS_ACCOUNT_ID}:role/dev-aws-load-balancer-controller-role \
          --set vpcId=${VPC_ID} \
          --set region=eu-north-1
          
      # 3. Inject the dynamic ECR image tag and roll out all Kubernetes manifests
      - name: Deploy Application Manifests to EKS
        run: |
          sed -i "s|IMAGE_PLACEHOLDER|${{ steps.login-ecr.outputs.registry }}/dev-my-kubernetes-app:${{ github.sha }}|g" kubernetes/deployment.yaml
          kubectl apply -f kubernetes/